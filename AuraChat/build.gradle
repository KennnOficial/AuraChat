plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'wtf.ken'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    testImplementation("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testImplementation("org.mockito:mockito-core:5.14.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.4")
}

tasks.named('test') { useJUnitPlatform() }
configurations {
    compatibilityApi
}
def compatibilityApiVersion = providers.gradleProperty('compatibilityApiVersion')
        .getOrElse('1.21.11-R0.1-SNAPSHOT')
dependencies {
    compatibilityApi("io.papermc.paper:paper-api:${compatibilityApiVersion}")
}
tasks.register('checkCompatibility', JavaCompile) {
    description = 'Compiles against a newer Paper API without changing the release JAR.'
    group = 'verification'
    source = sourceSets.main.java
    classpath = configurations.compatibilityApi
    destinationDirectory = layout.buildDirectory.dir('compatibility-classes')
    options.release.set(21)
}

def rangeChecks = (4..11).collect { patch ->
    def api = configurations.create("paper121${patch}")
    dependencies.add(api.name, "io.papermc.paper:paper-api:1.21.${patch}-R0.1-SNAPSHOT")
    tasks.register("checkPaper121${patch}", JavaCompile) {
        description = "Checks source compatibility with Paper 1.21.${patch}."
        group = 'verification'
        source = sourceSets.main.java
        classpath = api
        destinationDirectory = layout.buildDirectory.dir("compatibility/1.21.${patch}")
        options.release.set(21)
    }
}
tasks.register('checkSupportedVersions') {
    description = 'Checks every Paper API from 1.21.4 through 1.21.11.'
    group = 'verification'
    dependsOn(rangeChecks)
}

tasks {
    runServer {
        minecraftVersion("1.21.4")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

